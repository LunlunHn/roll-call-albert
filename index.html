<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roll Call</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:white;border:1px solid #e2e6ef;border-radius:16px;padding:20px;box-shadow:0 5px 20px #00000008}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{padding:14px;border-radius:12px;background:#f2f4f7}.num{font-size:24px;font-weight:750}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,input{padding:10px 12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.toolbar input{flex:1;min-width:190px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:650;cursor:pointer;background:#e9edf5;color:#172033}button.primary{background:#1d4ed8;color:white}button.danger{background:#fee4e2;color:#b42318}.row{display:grid;grid-template-columns:54px 1fr 90px 90px 90px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eef0f4}.roll{font-weight:700}.status{font-size:12px;font-weight:700;text-align:center;padding:5px;border-radius:999px}.present{background:#dcfae6;color:#067647}.absent{background:#fee4e2;color:#b42318}.late{background:#fef0c7;color:#b54708}.empty{background:#f2f4f7;color:#667085}.hidden{display:none!important}.auth{max-width:430px;margin:12vh auto}.auth h1{margin-bottom:4px}.auth input{width:100%;margin:6px 0}.small{font-size:13px}.toast{position:fixed;bottom:20px;right:20px;background:#172033;color:white;padding:11px 15px;border-radius:10px;display:none}.date{font-weight:700}.edit{width:100%}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:38px 1fr repeat(3,64px);font-size:13px}.row button{padding:8px 3px}.wrap{padding:12px}}
</style></head><body><div id="auth" class="auth card"><h1>Roll Call</h1><div class="muted">Private attendance system</div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="toolbar"><button class="primary" onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button></div><p class="small muted">Use the same account on your other devices.</p></div>
<div id="app" class="wrap hidden"><div class="top"><div><h1>Roll Call</h1><div class="muted">75 rolls · cloud synced</div></div><button onclick="signOut()">Sign out</button></div><div class="card" style="margin-top:16px"><div class="toolbar"><input id="search" placeholder="Search name or roll number" oninput="render()"><input id="date" type="date" onchange="loadAttendance()"><button onclick="markAll('present')">All present</button><button onclick="clearDay()">Clear day</button><button class="primary" onclick="saveNames()">Save name changes</button></div><div class="stats"><div class="stat"><div class="muted">Present</div><div id="p" class="num">0</div></div><div class="stat"><div class="muted">Absent</div><div id="a" class="num">0</div></div><div class="stat"><div class="muted">Late</div><div id="l" class="num">0</div></div><div class="stat"><div class="muted">Unmarked</div><div id="u" class="num">0</div></div></div><div id="list"></div></div></div><div id="toast" class="toast"></div>
<script>
const URL='https://yhangfzsmysyghxprwfi.supabase.co', KEY='sb_publishable_qgLiY4u-p73JzmLiZ853iQ_iCzPhGMl';
const names={1:'Betsy Lalkulpui',2:'Carolin Lhungdim',3:'Ch. Manneichin',4:'Chinghoihnem',5:'Chingthiankim',6:'Chinghaukim',7:'Chingmuankim Khongsai',8:'Chinsianhoih',9:'Chinthenkim Haokip',10:'Deborah Chinglawmkim',11:'Grace Lalsanhim',12:'H. Chingdeikim',13:'Hatchinthem Kipgen',14:'Kimsawnnei Vaiphei',15:'Lalmalsawmi',16:'Lamdeikim Chongloi',17:'Lawmmuansiam',18:'Lhingjahoih Khongsai',19:'Lhingjoujam',20:'Liandoinei',21:'Maman Tonsing',22:'Manlalchoi',23:'Marina Kimngaihlun',24:'Mary Thangbiakhoih',25:'Mercy Lianhoihlun',26:'Ngailalven',27:'Ngainunmawi',28:'Niangbiaklun',29:'Ninghoihsiam',31:'Ruth Chingthianmuang',32:'Tingpibuong Vaiphei',33:'Thuamnunsiam',34:'Vahngaihching Haokip',35:'Vungremkim',36:'Albert Lamsuanlun Simte',37:'Ankit Kumar',38:'David Darrofel',39:'Diamond Ngamgoulen Lhungdim',40:'Eddie Thangminlen',41:'Ginlunmang Tombing',42:'Hanglamthang Samte',43:'Hangmuanlian Haokip',44:'Henjaminlun Kipgen',45:'Jamminthang Bolsom',46:'Joel Liankhankhual',47:'K. Mungbiaksang',48:'Kailianthang Guite',49:'Kamminlal Sithlou',50:'Kevn Lalrohlu',51:'Khamgoulam David',52:'Lamvangmuan Vaiphei',53:'Lianzai Langel',54:'Manglaljalzou Vaiphei',55:'Michael Douchinkhup',56:'Muanchinlian Valte',57:'Nangkhankhual',58:'Nehminthang Khongsai',59:'Obed Thangsiankhai',60:'Paogoulen Mate',61:'Paumalsawm',62:'Paukhankhuol Zou',63:'Simon Seilalmon Singson',64:'Somelson Vaiphei',65:'Somminlen Mate',66:'Songoulal',67:'Thangjohn Tunglut',68:'Thangkhanmuan Thomte',69:'Thanglalven Khaute',70:'Thangtinsat Haokip',71:'Thangzahau Vaiphei',72:'V. Mangdouthang',74:'Manthianven',75:'LS David Paominchon Mate'};
let token=localStorage.getItem('rc_token'), user=JSON.parse(localStorage.getItem('rc_user')||'null'), students=[], attendance={};
const today=()=>new Date().toISOString().slice(0,10); document.getElementById('date').value=today();
async function api(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
async function auth(path,body){let r=await fetch(URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});let t=await r.text();if(!r.ok)throw Error(t);return JSON.parse(t)}
function msg(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
async function signIn(){try{let x=await auth('token?grant_type=password',{email:email.value,password:password.value}); token=x.access_token;user=x.user;localStorage.setItem('rc_token',token);localStorage.setItem('rc_user',JSON.stringify(user));await start()}catch(e){msg('Sign in failed: '+e.message)}}
async function signUp(){try{let x=await auth('signup',{email:email.value,password:password.value});if(x.access_token){token=x.access_token;user=x.user;localStorage.setItem('rc_token',token);localStorage.setItem('rc_user',JSON.stringify(user));await start()}else msg('Account created. Check your email if confirmation is required.')}catch(e){msg('Sign up failed: '+e.message)}}
function signOut(){localStorage.clear();location.reload()}
async function start(){authBox.classList.add('hidden');app.classList.remove('hidden');await loadStudents();await loadAttendance()}
async function loadStudents(){students=await api('/rest/v1/students?select=*&order=roll_no.asc');if(!students.length){let rows=Object.keys(names).map(n=>({owner_id:user.id,roll_no:+n,name:names[n]}));await api('/rest/v1/students',{method:'POST',body:JSON.stringify(rows)});students=await api('/rest/v1/students?select=*&order=roll_no.asc')}render()}
async function loadAttendance(){let d=date.value;let rows=await api('/rest/v1/attendance?select=*&attendance_date=eq.'+d);attendance={};rows.forEach(x=>attendance[x.student_id]=x.status);render()}
function render(){let q=(search.value||'').toLowerCase();let shown=Array.from({length:75},(_,i)=>i+1).filter(n=>!q||String(n).includes(q)||(names[n]||'').toLowerCase().includes(q));let byRoll={};students.forEach(s=>byRoll[s.roll_no]=s);list.innerHTML=shown.map(n=>{let s=byRoll[n],st=s?attendance[s.id]:null;if(!s)return `<div class="row"><div class="roll">${n}</div><div class="muted">Unallocated</div><span></span><span></span><span></span></div>`;return `<div class="row"><div class="roll">${n}</div><input class="edit" data-id="${s.id}" value="${esc(s.name)}"><button onclick="setStatus('${s.id}','present')">Present</button><button onclick="setStatus('${s.id}','absent')">Absent</button><button onclick="setStatus('${s.id}','late')">Late</button></div>`}).join('');let vals=Object.values(attendance);p.textContent=vals.filter(x=>x==='present').length;a.textContent=vals.filter(x=>x==='absent').length;l.textContent=vals.filter(x=>x==='late').length;u.textContent=75-vals.length}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function setStatus(id,status){let d=date.value;try{await api('/rest/v1/attendance?student_id=eq.'+id+'&attendance_date=eq.'+d,{method:'DELETE'});await api('/rest/v1/attendance',{method:'POST',body:JSON.stringify({owner_id:user.id,student_id:id,attendance_date:d,status})});attendance[id]=status;render()}catch(e){msg('Could not save attendance')}}
async function markAll(status){for(let s of students) await setStatus(s.id,status);msg('Marked all as '+status)}
async function clearDay(){if(!confirm('Clear all attendance for '+date.value+'?'))return;await api('/rest/v1/attendance?attendance_date=eq.'+date.value,{method:'DELETE'});attendance={};render();msg('Day cleared')}
async function saveNames(){try{for(const el of document.querySelectorAll('.edit')){let s=students.find(x=>x.id===el.dataset.id);if(s&&el.value.trim()&&el.value.trim()!==s.name){await api('/rest/v1/students?id=eq.'+s.id,{method:'PATCH',body:JSON.stringify({name:el.value.trim()})});s.name=el.value.trim()}}msg('Names saved')}catch(e){msg('Could not save names')}}
if(token&&user)start().catch(()=>{localStorage.clear();location.reload()});
</script></body></html>
